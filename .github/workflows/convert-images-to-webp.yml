name: Convert Images to WebP

on:
  push:
    branches:
      - '**'
    paths:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'

permissions:
  contents: write

concurrency:
  group: webp-convert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Convert PNG/JPG/JPEG to WebP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools (cwebp)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert images to WebP
        id: convert
        shell: bash
        run: |
          set -euo pipefail

          # Branch-should-compare SHAs from the push event.
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # Files that changed in this push (all commits), only for images still
          # present after checkout. Falls back to all tracked images when the
          # branch is brand new (before == all-zeros / missing).
          is_new_ref="false"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            is_new_ref="true"
          fi

          files=()
          if [ "${is_new_ref}" = "true" ]; then
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              case "${f}" in
                *.png|*.jpg|*.jpeg) files+=("${f}") ;;
              esac
            done < <(git ls-files '*.png' '*.jpg' '*.jpeg')
          else
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              case "${f}" in
                *.png|*.jpg|*.jpeg) files+=("${f}") ;;
              esac
            done < <(git diff --name-only "${before}" "${after}")
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "Push contains no PNG/JPG/JPEG changes."
            echo "converted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          converted=0
          for src in "${files[@]}"; do
            [ -f "${src}" ] || continue
            # PWA/favicon PNGs must stay PNG; skip that directory.
            case "${src}" in
              images/favicon_io/*) continue ;;
            esac
            base="${src%.*}"
            dst="${base}.webp"
            if cwebp -q 80 "${src}" -o "${dst}" 2>/dev/null; then
              converted=$((converted + 1))
            else
              echo "::warning::Failed to convert ${src}"
            fi
          done

          echo "converted=${converted}" >> "$GITHUB_OUTPUT"

      - name: Commit WebP files
        if: steps.convert.outputs.converted != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.webp'
          if git diff --cached --quiet; then
            echo "No new WebP files to commit."
          else
            git commit -m "chore: auto-convert images to WebP [skip ci]"
            git push origin "${{ github.head_ref || github.ref_name }}"
          fi

      # ---------------------------------------------------------------------
      # cPanel / FTP deployment (OPTIONAL — enable manually).
      #
      # This repo is deployed to a cPanel host over FTP. To enable automatic
      # deployment of the converted WebP files:
      #
      #   1. Add the following repository secrets:
      #        FTP_SERVER   - e.g. ftp.example.com (no scheme, no path)
      #        FTP_USERNAME - cPanel FTP account username
      #        FTP_PASSWORD - cPanel FTP account password
      #   2. Uncomment the job below.
      #
      # The deployment only runs after an image conversion commit, so it never
      # fires on every push.
      #
      # - name: Deploy to cPanel via FTP
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     server-dir: /public_html/